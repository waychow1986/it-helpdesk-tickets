server:
  port: 8080
  forward-headers-strategy: native
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
  error:
    whitelabel:
      enabled: false
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: helpdesk
  datasource:
    url: jdbc:postgresql://${AIDH_DEP_TICKET_DB_HOST}:${AIDH_DEP_TICKET_DB_PORT}/${AIDH_DEP_TICKET_DB_DATABASE}?sslmode=require&currentSchema=${app.db.schema}&authenticationPluginClassName=com.azure.identity.extensions.jdbc.postgresql.AzurePostgresqlAuthenticationPlugin
    username: ${AIDH_DEP_TICKET_DB_USER}
    hikari:
      maximum-pool-size: 10
      max-lifetime: 1800000  # 30m
      connection-timeout: 30000  # 30s
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
    schemas: ${app.db.schema}
    default-schema: ${app.db.schema}
  thymeleaf:
    cache: true
  mvc:
    format:
      date: yyyy-MM-dd

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    org.springframework.jdbc: INFO
    org.flywaydb: INFO

app:
  time-zone: Asia/Shanghai
  db:
    # 候选、QA、生产不覆盖（TD-017）；其他值只用于开发者测试的一次性 schema（TD-016）
    schema: public
  setup:
    # 一次性设置口令只由平台机密注入（TD-019），不在配置文件中写值
    token: ${AIDH_SECRET_INITIAL_SETUP_TOKEN:}
