server:
  port: 8080
  forward-headers-strategy: native
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
  error:
    whitelabel:
      enabled: false
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: helpdesk
  datasource:
    url: jdbc:postgresql://${AIDH_DEP_TICKET_DB_HOST}:5432/${AIDH_DEP_TICKET_DB_DATABASE}?sslmode=require&authenticationPluginClassName=com.azure.identity.extensions.jdbc.postgresql.AzurePostgresqlAuthenticationPlugin
    username: ${AIDH_DEP_TICKET_DB_USER}
    hikari:
      maximum-pool-size: 10
      max-lifetime: 1800000  # 30m
      connection-timeout: 30000  # 30s
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  thymeleaf:
    cache: true
  mvc:
    format:
      date: yyyy-MM-dd

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    org.springframework.jdbc: INFO
    org.flywaydb: INFO

app:
  time-zone: Asia/Shanghai
  bootstrap:
    admin-login-name: admin
    admin-display-name: 初始管理员
