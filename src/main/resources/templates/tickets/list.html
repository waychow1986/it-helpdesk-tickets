<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(${pageTitle})}"></head>
<body>
<header th:replace="~{layout :: nav}"></header>
<main>
  <h1 data-testid="list-title" th:text="${pageTitle}">工单</h1>
  <div th:replace="~{layout :: flash}"></div>
  <form method="get" th:action="@{/tickets}" class="filters" novalidate>
    <label>关键词 <input type="text" name="q" th:value="${criteria.keyword}" data-testid="filter-q"></label>
    <label>状态
      <select name="status" data-testid="filter-status">
        <option value="">全部</option>
        <option th:each="s : ${statuses}" th:value="${s.name()}" th:text="${s.label}"
                th:selected="${criteria.status == s}">状态</option>
      </select>
    </label>
    <label>类别
      <select name="categoryId" data-testid="filter-category">
        <option value="">全部</option>
        <option th:each="c : ${categoryOptions}" th:value="${c.id}" th:text="${c.label()}"
                th:selected="${criteria.categoryId != null and criteria.categoryId == c.id}">类别</option>
      </select>
    </label>
    <label>处理人
      <select name="assignee" data-testid="filter-assignee">
        <option value="">全部</option>
        <option value="unassigned" th:selected="${criteria.unassigned}">未分配</option>
        <option th:each="a : ${assigneeOptions}" th:value="${a.id}" th:text="${a.displayName}"
                th:selected="${criteria.assigneeId != null and criteria.assigneeId == a.id}">处理人</option>
      </select>
    </label>
    <label>提交日期从 <input type="date" name="from" th:value="${criteria.fromDate}" data-testid="filter-from"></label>
    <label>至 <input type="date" name="to" th:value="${criteria.toDate}" data-testid="filter-to"></label>
    <button type="submit" data-testid="filter-submit">搜索</button>
    <a th:href="@{/tickets}" data-testid="filter-clear">清除条件</a>
  </form>
  <p th:if="${criteria.dateRangeError != null}" class="flash err" data-testid="filter-error" th:text="${criteria.dateRangeError}"></p>
  <p th:if="${result.empty}" data-testid="ticket-empty" class="empty">无匹配工单</p>
  <table th:unless="${result.empty}" class="grid">
    <thead>
    <tr><th>编号</th><th>标题</th><th>类别</th><th>紧急程度</th><th>状态</th><th>处理人</th><th>提交人</th><th>提交时间</th></tr>
    </thead>
    <tbody>
    <tr th:each="t : ${result.items}" data-testid="ticket-row" th:attr="data-ticket-id=${t.id}">
      <td><a th:href="@{/tickets/{id}(id=${t.id})}" th:text="'#' + ${t.id}" data-testid="ticket-link">#1</a></td>
      <td data-testid="row-title" th:text="${t.title}">标题</td>
      <td data-testid="row-category" th:text="${t.categoryLabel()}">类别</td>
      <td data-testid="row-urgency" th:text="${t.urgency.label}">中</td>
      <td data-testid="row-status" th:text="${t.status.label}">待处理</td>
      <td data-testid="row-assignee" th:text="${t.assigneeLabel()}">未分配</td>
      <td data-testid="row-submitter" th:text="${t.submitterName}">提交人</td>
      <td data-testid="row-submitted" th:text="${@timeFormat.format(t.submittedAt)}">时间</td>
    </tr>
    </tbody>
  </table>
  <nav class="pager">
    <a th:if="${result.hasPrevious()}" th:href="${prevUrl}" data-testid="page-prev">上一页</a>
    <span th:text="'第 ' + ${result.page} + ' 页'">第 1 页</span>
    <a th:if="${result.hasNext}" th:href="${nextUrl}" data-testid="page-next">下一页</a>
  </nav>
</main>
</body>
</html>
