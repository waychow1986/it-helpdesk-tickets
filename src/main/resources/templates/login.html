<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('登录')}"></head>
<body>
<header class="topbar"><span class="brand">IT 工单系统</span></header>
<main class="narrow">
  <h1>登录</h1>
  <p th:if="${param.error != null}" class="flash err" data-testid="login-error">登录名或密码错误</p>
  <p th:if="${param.logout != null}" class="flash ok" data-testid="flash">您已退出登录</p>
  <p th:if="${param.setup != null}" class="flash ok" data-testid="setup-success">初始管理员已设置，请使用该账号登录</p>
  <form method="post" th:action="@{/login}" novalidate>
    <label>登录名 <input type="text" name="username" data-testid="login-username" autocomplete="username"></label>
    <label>密码 <input type="password" name="password" data-testid="login-password" autocomplete="current-password"></label>
    <button type="submit" data-testid="login-submit">登录</button>
  </form>
  <p class="hint">账号由管理员统一创建，如需账号请联系管理员。</p>
  <p th:if="${setupOpen}"><a th:href="@{/setup}" data-testid="setup-link">设置初始管理员</a></p>
</main>
</body>
</html>
